<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explainable AI - MediVision AI</title><link rel="stylesheet" href="css/style.css"></head>
<body class="bg"><script src="js/app.js"></script><script>navbar("explainable-ai")</script>
<main class="wrap"><h1>Explainable AI</h1><p class="sub">Grad-CAM: warm colours (red/yellow) mark regions that influenced the model most.</p><div id="out"></div></main>
<script>
loadScan().then(r=>{
 if(!r){out.innerHTML='<a class="btn" href="history.html">Pick a scan from History</a>';return}
 const lvl=r.confidence>=90?"high":r.confidence>=70?"moderate":"low";
 out.innerHTML=(r.mode==="demo"?'<div class="demo">The heatmap below is synthetic and does not reflect any model.</div>':"")+
 `<div class="grid"><div class="card"><h2>Original</h2><img class="pv" src="${r.original}"></div>
 <div class="card"><h2>Overlay</h2><div class="cmp"><img src="${r.original}"><img class="top" id="hm" src="${r.heatmap}" style="opacity:.6"></div>
 <p class="warn">Heatmap opacity (slide to compare with original)</p><input type="range" min="0" max="100" value="60" oninput="document.getElementById('hm').style.opacity=this.value/100"></div></div><br>
 <div class="card"><h2>Why this prediction?</h2><p>Prediction: <span class="pill ${esc(r.label)}">${esc(r.label)}</span> at ${r.confidence}% (${lvl} confidence).</p>
 <p class="warn">Red/yellow areas pushed the model toward this output. Check whether they fall on anatomically relevant regions; if they sit on text markers, borders or equipment, treat the prediction with suspicion. ${lvl==="low"?"Low confidence: seek clinician review.":""}</p>
 <p class="warn"></p></div><br><a class="btn ghost" href="classification.html?id=${r.id}">← Back</a> <a class="btn" href="report.html?id=${r.id}">Open Report →</a>`}).catch(e=>toast(e.message,true));
</script></body></html>
