<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patients - MediVision AI</title><link rel="stylesheet" href="css/style.css"></head>
<body class="bg"><script src="js/app.js"></script><script>navbar("patients")</script>
<main class="wrap"><div class="row"><h1 style="flex:1">Patients</h1><button class="btn" id="add">+ Add patient</button></div>
<div class="row"><input id="q" placeholder="Search by name or patient ID"></div><div class="grid" id="list"></div></main>
<div class="modal" id="fm"><div class="card"><h2 id="ft">Add patient</h2>
<input id="pid" placeholder="Patient ID (unique)"><input id="pn" placeholder="Full name"><input id="pa" type="number" min="0" max="120" placeholder="Age">
<select id="ps"><option value="">Sex</option><option>Female</option><option>Male</option><option>Other</option></select><input id="pno" placeholder="Notes (optional)"><br>
<button class="btn" id="save">Save</button> <button class="btn ghost" onclick="modal('fm',false)">Cancel</button></div></div>
<div class="modal" id="vm"><div class="card"><h2 id="vt"></h2><div id="vb"></div><br><button class="btn ghost" onclick="modal('vm',false)">Close</button></div></div>
<script>
let items=[],editing=null;
async function load(){items=(await api("/patients?q="+encodeURIComponent(q.value))).items;
 list.innerHTML=items.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><p class="warn">ID ${esc(p.pid)} · ${p.age||"?"} y · ${esc(p.sex)||"n/a"}<br>${p.scans} scan(s)</p><br>
 <button class="btn sm" onclick="view(${p.id})">Profile</button> <button class="btn sm ghost" onclick="edit(${p.id})">Edit</button> <button class="btn sm red" onclick="rm(${p.id})">Delete</button></div>`).join("")||'<p class="sub">No patients yet.</p>'}
q.oninput=load;
add.onclick=()=>{editing=null;ft.textContent="Add patient";[pid,pn,pa,ps,pno].forEach(e=>e.value="");pid.disabled=false;modal("fm",true)};
function edit(i){const p=items.find(x=>x.id===i);editing=i;ft.textContent="Edit patient";pid.value=p.pid;pid.disabled=true;pn.value=p.name;pa.value=p.age||"";ps.value=p.sex;pno.value=p.notes;modal("fm",true)}
save.onclick=async()=>{const b={pid:pid.value.trim(),name:pn.value.trim(),age:pa.value,sex:ps.value,notes:pno.value};
 try{editing?await jsend("/patients/"+editing,b,"PUT"):await jsend("/patients",b);modal("fm",false);toast("Saved");load()}catch(x){toast(x.message,true)}};
async function rm(i){if(!confirm("Delete this patient record? Their scans are kept."))return;await api("/patients/"+i,{method:"DELETE"});toast("Deleted");load()}
async function view(i){const p=items.find(x=>x.id===i);vt.textContent=p.name;
 const s=await api("/scans?per=20&q="+encodeURIComponent(p.pid));
 vb.innerHTML=`<p class="warn">ID ${esc(p.pid)} · ${p.age||"?"} y · ${esc(p.sex)}<br>${esc(p.notes)}</p><h3>Scan records</h3>`+(s.items.filter(r=>r.patient_id===p.pid).map(r=>`<p><a href="classification.html?id=${r.id}">#${r.id} ${esc(r.scan_type)}: ${esc(r.label)} ${r.confidence}%</a></p>`).join("")||'<p class="warn">No scans linked. Enter this Patient ID on the Upload page.</p>');modal("vm",true)}
load().catch(e=>toast(e.message,true));
</script></body></html>
